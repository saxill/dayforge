name: Dayforge
options:
  bundleIdPrefix: com.omnirush
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Dayforge:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Dayforge
        excludes:
          - Resources/MangaPin.json
      - path: Shared
    entitlements:
      path: Dayforge/Dayforge.entitlements
      properties:
        com.apple.security.application-groups: [group.com.omnirush.dayforge]
    dependencies:
      - target: DayforgeWidgets
    settings:
      base:
        PRODUCT_NAME: Dayforge
        PRODUCT_BUNDLE_IDENTIFIER: com.omnirush.dayforge
        DEVELOPMENT_TEAM: K75VPCXM64
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Dayforge
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Light
        INFOPLIST_KEY_NSSupportsLiveActivities: YES
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
  DayforgeWidgets:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: DayforgeWidgets
      - path: Shared
    entitlements:
      path: DayforgeWidgets/DayforgeWidgets.entitlements
      properties:
        com.apple.security.application-groups: [group.com.omnirush.dayforge]
    info:
      path: DayforgeWidgets/Info.plist
      properties:
        CFBundleDisplayName: Dayforge Widgets
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omnirush.dayforge.widgets
        DEVELOPMENT_TEAM: K75VPCXM64
        CODE_SIGN_STYLE: Automatic
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
